<rml>
<head>
    <style>
        body { width: 100%; height: 100%; }
        #crosshair_h {
            position: absolute;
            left: 50%; 
            top: 50%; 
            margin-left: -12px;
            margin-top: -1px;
            width: 24px; 
            height: 2px;
            background-color: #ffffffcc;
        }
        #crosshair_v { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            margin-left: -1px; 
            margin-top: -12px;
            width: 2px; 
            height: 24px; 
            background-color: #ffffffcc; 
        }
        #kills { 
            position: absolute; 
            left: 16px; 
            top: 16px; 
            width: 0px; 
            height: 14px;
            background-color: #ff3333; 
        }
        #health {
            position: absolute; 
            left: 16px; 
            top: 36px; 
            width: 200px; 
            height: 14px;
            background-color: #33cc33; 
        }
    </style>
</head>
<body>
    <div id="crosshair_h"/>
    <div id="crosshair_v"/>
    <div id="kills"/>
    <div id="health"/>
</body>
</rml>
